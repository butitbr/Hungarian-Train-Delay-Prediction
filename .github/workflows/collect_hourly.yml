name: Collect Train Data (Hourly)

on:
  schedule:
    # Run every 3 hours: 5 AM, 8 AM, 11 AM, 2 PM, 5 PM, 8 PM, 11 PM, 2 AM UTC
    - cron: '0 5,8,11,14,17,20,23,2 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Collect train data (incremental mode)
        env:
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
        run: |
          python collect_train_data.py --incremental --verbose --batch-size 5 --max-concurrent 3
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Collection script exited with code $EXIT_CODE"
            # Show last 50 lines of the most recent log for debugging
            LATEST_LOG=$(ls -t logs/collect_*.log 2>/dev/null | head -1)
            if [ -n "$LATEST_LOG" ]; then
              echo "=== Last 50 lines of $LATEST_LOG ==="
              tail -50 "$LATEST_LOG"
            fi
            exit $EXIT_CODE
          fi
      
      - name: Check data quality
        run: |
          python -c "
          from pathlib import Path
          from utils.data_quality import check_data_quality
          from datetime import datetime
          
          # Find today's file
          date_str = datetime.now().strftime('%Y%m%d')
          csv_file = Path(f'data/collected/trains_{date_str}.csv')
          
          if csv_file.exists():
              check_data_quality(csv_file, verbose=True)
          else:
              print(f'No file found for today: {csv_file}')
          "
      
      - name: Commit and push if changed
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/collected/
          git add logs/
          
          # Check if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "Train data: $TIMESTAMP"
            # Retry push up to 3 times to handle concurrent workflow race conditions
            for attempt in 1 2 3; do
              git pull --rebase && git push && break || {
                echo "Push attempt $attempt failed, retrying..."
                sleep $((attempt * 5))
              }
            done
            echo "Changes committed and pushed"
          fi
